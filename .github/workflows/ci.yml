name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, check, test
    runs-on: ubuntu-latest

    # Real PostgreSQL and Redis: the FIFO locking, audit triggers and CHECK
    # constraints this system relies on cannot be exercised on SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pharmagros_test
          POSTGRES_USER: pharmagros
          POSTGRES_PASSWORD: pharmagros
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key-not-production
      DATABASE_URL: postgres://pharmagros:pharmagros@localhost:5432/pharmagros_test
      REDIS_URL: redis://localhost:6379/15
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 shared-mime-info gettext

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.1

      - name: Lint
        run: ruff check apps config

      # Reporting-only until the tree is reformatted in a dedicated commit:
      # `ruff format` currently rewrites ~3300 lines across 51 files, which is
      # not something to fold into an unrelated change. Drop the `|| true` once
      # that commit lands.
      - name: Format check
        run: ruff format --check apps config || true

      - name: Django system check (deploy profile)
        # Must run against the production settings. The job-level
        # DJANGO_SETTINGS_MODULE is `test`, which deliberately turns off
        # SECURE_SSL_REDIRECT and the secure cookies so the suite can run over
        # plain HTTP — checking that profile reports those as W008/W012/W016
        # and tells us nothing about the real deploy posture.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-deploy-check-key-long-enough-to-pass-w009-000000
          JWT_SIGNING_KEY: ci-deploy-check-distinct-jwt-signing-key-000000
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: Verify no missing migrations
        # A model change without a migration breaks deploys silently, so it
        # fails the build rather than surfacing in production.
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Seed RBAC and sequences
        run: |
          python manage.py seed_rbac
          python manage.py seed_sequences

      - name: Run tests
        run: pytest

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict
        continue-on-error: true

      - name: Static security analysis
        run: |
          pip install bandit
          bandit -r apps config -ll -x '*/tests/*,*/migrations/*'

      # gitleaks-action requires a paid licence for organization-owned repos,
      # so the scan runs from the binary directly. Same engine, no licence.
      - name: Secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks dir . --redact --no-banner

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
