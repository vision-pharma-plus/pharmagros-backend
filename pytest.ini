[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    --ignore=tests/test_end_to_end.py
    --ignore=tests/test_api_smoke.py
    --ignore=tests/test_translations.py
testpaths = tests
norecursedirs = .venv node_modules
markers =
    integration: requires a live PostgreSQL database
    slow: takes more than a second
filterwarnings =
    ignore::DeprecationWarning
